<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleGrid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <!-- Name entry: first screen on load -->
  <section id="name-entry" class="screen splash" aria-label="Enter your name">
    <div class="splash__glow" aria-hidden="true"></div>
    <img class="splash__logo" src="Images/Game%20Logo.png" alt="BattleGrid">
    <form id="name-form" class="name-form">
      <label class="name-form__label" for="player-name">What should we call you, Commander?</label>
      <input id="player-name" class="name-form__input" type="text" maxlength="20"
             autocomplete="nickname" placeholder="Enter your name" required>
      <button class="name-form__button" type="submit">Set Sail</button>
    </form>
  </section>

  <!-- Splash screen: shown for 5 seconds after the name is entered -->
  <section id="splash" class="screen splash" aria-label="Welcome" hidden>
    <div class="splash__glow" aria-hidden="true"></div>
    <img class="splash__logo" src="Images/Game%20Logo.png" alt="BattleGrid">
    <p id="welcome-message" class="splash__welcome">Welcome Commander</p>
    <div class="splash__loader" role="progressbar" aria-label="Loading">
      <div class="splash__loader-fill"></div>
    </div>
    <p class="splash__status">Charting the waters&hellip;</p>
  </section>

  <!-- Main game: built out in upcoming iterations -->
  <main id="game" class="screen game" hidden>
    <h1 class="game__title">BattleGrid</h1>
    <p class="game__note">The battlefield is being prepared. Stay tuned.</p>
  </main>

  <script src="js/main.js?v=2"></script>
</body>
</html>
